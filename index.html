<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 検索よけ -->
  <meta name="robots" content="noindex,nofollow">
  <title>Gallery</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background-color: #000; 
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px; /* 画像・動画どうしの隙間 */
    }
    img, video {
      max-width: 100%;
      height: auto;
      max-height: 90vh; /* 縦長すぎる画像が画面からはみ出ないようにする */
      border-radius: 4px; /* 角を少し丸くする */
      display: block;
    }
  </style>
</head>
<body>

  <div id="gallery">読み込み中...</div>

  <script>

    const username = 'Lingmud33';
    const repo = 'lsistsCCC';
    const folder = 'media';

    async function loadMedia() {
      const gallery = document.getElementById('gallery');
      const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${folder}`;
      
      try {
        const response = await fetch(apiUrl);
        const files = await response.json();
        gallery.innerHTML = ''; // 「読み込み中...」を消す

        // ファイル名順（01.jpg, 02.mp4...など）に並べる
        files.sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));

        files.forEach(file => {
          // 拡張子を取り出す
          const ext = file.name.split('.').pop().toLowerCase();
          
          // 画像ファイルの場合
          if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
            const img = document.createElement('img');
            img.src = file.download_url;
            img.loading = 'lazy'; // スクロールして近づいたら読み込む（重くならない工夫）
            gallery.appendChild(img);
          } 
          // 動画ファイルの場合
          else if (['mp4', 'webm', 'mov'].includes(ext)) {
            const video = document.createElement('video');
            video.src = file.download_url;
            video.controls = true;    // 再生ボタンやシークバーを表示
            video.playsInline = true; // スマホで勝手に全画面になるのを防ぐ
            video.preload = 'metadata';
            
            // ※もし動画も「音無しで自動ループ再生」にしたい場合は、下の3行の「//」を消してください
            // video.autoplay = true;
            // video.muted = true;
            // video.loop = true;

            gallery.appendChild(video);
          }
        });
      } catch (error) {
        gallery.innerHTML = 'データの読み込みに失敗しました。IDやリポジトリ名が合っているか確認してください。';
      }
    }

    loadMedia();
  </script>
</body>
</html>
