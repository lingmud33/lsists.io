<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WACHA-WACHA 3D KNOCKOUT! - Computer Communication Circle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a103c; color: #fff; font-family: 'M PLUS Rounded 1c', sans-serif; touch-action: none; }
    .font-arcade { font-family: 'Orbitron', 'M PLUS Rounded 1c', sans-serif; }
    .pop-panel { background: rgba(26, 16, 60, 0.92); backdrop-filter: blur(10px); border: 3px solid rgba(255, 255, 255, 0.25); box-shadow: 0 8px 0 rgba(0, 0, 0, 0.4), 0 0 25px rgba(236, 72, 153, 0.3); border-radius: 18px; }
    .arcade-btn { box-shadow: 0 4px 0 rgba(0,0,0,0.5); transition: transform 0.08s, box-shadow 0.08s; }
    .arcade-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.5); }
    @keyframes floatPop {
      0% { transform: translate(-50%, 0) scale(0.7); opacity: 1; }
      30% { transform: translate(-50%, -18px) scale(1.15); opacity: 1; }
      100% { transform: translate(-50%, -55px) scale(0.95); opacity: 0; }
    }
    .floating-score { position: absolute; pointer-events: none; animation: floatPop 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; font-weight: 900; text-shadow: 0 3px 0 #000, 0 0 10px rgba(0,0,0,0.8); z-index: 40; white-space: nowrap; }
    @keyframes danmakuMove {
      from { transform: translateX(100vw); }
      to { transform: translateX(-120%); }
    }
    .danmaku-item { position: absolute; white-space: nowrap; font-weight: 900; text-shadow: 0 4px 0 #000; pointer-events: none; animation: danmakuMove 6.5s linear forwards; z-index: 45; }
  </style>
</head>
<body class="flex flex-col h-screen w-screen overflow-hidden">

  <!-- ヘッダー -->
  <header id="top-bar" class="h-12 bg-gradient-to-r from-indigo-950 via-purple-900 to-pink-900 border-b-4 border-pink-500/60 px-3 flex items-center justify-between z-50 shrink-0 shadow-lg">
    <div class="flex items-center gap-2">
      <div class="w-3.5 h-3.5 rounded-full bg-yellow-400 animate-bounce shadow-[0_0_10px_#facc15]" id="net-led"></div>
      <h1 class="font-black text-xs md:text-lg tracking-wider text-white drop-shadow">
        🎪 WACHA-WACHA <span class="text-yellow-300">KNOCKOUT!</span>
      </h1>
      <span id="conn-badge" class="text-[10px] bg-black/50 text-emerald-300 border border-emerald-400/50 px-2 py-0.5 rounded-full font-bold">SYNC</span>
    </div>

    <div class="flex items-center gap-1.5">
      <label class="arcade-btn cursor-pointer text-[11px] px-2 py-1 rounded-lg bg-amber-400 hover:bg-amber-300 text-slate-950 font-black flex items-center gap-1">
        📁 .glb読込
        <input type="file" id="glb-file-input" accept=".glb,.gltf" class="hidden" onchange="handleLocalGLBUpload(event)" />
      </label>
      <button onclick="switchViewMode('host')" id="btn-mode-host" class="arcade-btn text-[11px] px-2 py-1 rounded-lg bg-indigo-800 text-indigo-100 font-bold">大画面</button>
      <button onclick="switchViewMode('split')" id="btn-mode-split" class="arcade-btn text-[11px] px-2 py-1 rounded-lg bg-indigo-800 text-indigo-100 font-bold">分割</button>
      <button onclick="switchViewMode('controller')" id="btn-mode-ctrl" class="arcade-btn text-[11px] px-2 py-1 rounded-lg bg-indigo-800 text-indigo-100 font-bold">スマホ</button>
      <button onclick="toggleAudio()" id="btn-audio" class="arcade-btn text-[11px] px-2 py-1 rounded-lg bg-emerald-500 text-slate-950 font-black">🔊 音</button>
    </div>
  </header>

  <!-- メインコンテナ -->
  <div id="main-wrapper" class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">

    <!-- 大画面ホスト画面 -->
    <div id="host-section" class="flex-1 relative flex overflow-hidden bg-indigo-950">
      <aside class="w-68 pop-panel m-2 z-20 flex flex-col justify-between p-2.5 shrink-0 hidden md:flex">
        <div class="space-y-2">
          <div class="bg-indigo-950/90 border-2 border-pink-400/60 rounded-xl p-2 text-center">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[11px] font-black text-yellow-300">📱 スマホで参加</span>
              <span class="text-[9px] bg-pink-500 text-white px-1.5 py-0.5 rounded-full font-black animate-pulse">無料</span>
            </div>
            <div id="qrcode-box" class="bg-white p-1 rounded-lg inline-block my-0.5"></div>
            <div class="mt-0.5 bg-black/60 rounded-lg py-0.5 px-2 flex items-center justify-between text-xs">
              <span class="text-[10px] text-indigo-200 font-bold">ROOM</span>
              <span id="room-code-text" class="font-arcade font-black text-yellow-300 tracking-widest">----</span>
            </div>
          </div>

          <div class="bg-black/50 border border-indigo-500/30 rounded-xl p-2">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[10px] font-black text-cyan-300">📡 通信</span>
              <span id="pps-label" class="font-arcade text-[10px] text-emerald-400">0 pkt/s</span>
            </div>
            <canvas id="net-canvas" width="200" height="42" class="w-full bg-indigo-950/90 rounded-lg border border-indigo-800"></canvas>
          </div>
        </div>

        <div class="space-y-1.5 pt-1.5 border-t border-white/15">
          <div class="bg-indigo-950/90 border border-cyan-400/40 rounded-xl p-2">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[11px] font-black text-cyan-300">🤖 AI CPU</span>
              <span id="bot-count-badge" class="font-arcade text-[11px] font-black bg-cyan-500/20 text-cyan-200 px-2 py-0.5 rounded-full">4体</span>
            </div>
            <div class="grid grid-cols-3 gap-1">
              <button onclick="removeBot()" class="arcade-btn bg-rose-500 text-white font-black py-1 rounded text-[11px]">➖減らす</button>
              <button onclick="spawnBot()" class="arcade-btn bg-cyan-400 text-slate-950 font-black py-1 rounded text-[11px]">➕増やす</button>
              <button onclick="clearBots()" class="arcade-btn bg-slate-700 text-slate-200 font-bold py-1 rounded text-[10px]">0体</button>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-1">
            <button onclick="triggerArenaEvent()" class="arcade-btn bg-pink-500 text-white font-black py-1 rounded-xl text-xs">⚡ ギミック</button>
            <button onclick="resetMatch()" class="arcade-btn bg-indigo-800 text-indigo-100 font-bold py-1 rounded-xl text-xs">🔄 リセット</button>
          </div>
        </div>
      </aside>

      <main class="flex-1 relative overflow-hidden" id="three-container">
        <div id="floating-layer" class="absolute inset-0 pointer-events-none overflow-hidden z-30"></div>
        <div id="danmaku-layer" class="absolute inset-0 pointer-events-none overflow-hidden z-40"></div>

        <div class="absolute top-2 left-1/2 -translate-x-1/2 z-30 flex flex-col items-center pointer-events-none w-full max-w-md px-2">
          <div class="pop-panel px-4 py-1 flex items-center gap-3 border-2 border-yellow-400/60">
            <div class="text-center">
              <div class="text-[8px] text-pink-300 font-black">NEXT</div>
              <div id="event-timer" class="font-arcade text-lg font-black text-yellow-300">00:20</div>
            </div>
            <div class="h-5 w-0.5 bg-white/20"></div>
            <div class="text-left">
              <div class="text-[8px] text-cyan-300 font-black">MISSION</div>
              <div id="stage-status" class="text-xs font-black text-white">👑 中央の「王冠」を奪い合え！</div>
            </div>
          </div>
          <div id="big-alert" class="hidden mt-2 bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-600 text-white font-black px-4 py-1.5 rounded-xl shadow border-2 border-white text-sm tracking-wider animate-bounce">
            ⚠️ ギミック発動！！
          </div>
        </div>

        <div class="absolute top-2 right-2 w-48 pop-panel p-2 z-30 pointer-events-none">
          <div class="flex items-center justify-between border-b border-white/15 pb-1 mb-1">
            <span class="text-[11px] font-black text-yellow-300">🏆 ランキング</span>
            <span id="player-count" class="text-[10px] bg-pink-500 text-white px-2 py-0.5 rounded-full font-black">0人</span>
          </div>
          <div id="leaderboard" class="space-y-1 text-[11px] max-h-48 overflow-y-auto"></div>
        </div>
      </main>
    </div>

    <!-- スマホコントローラー画面（見切れない完全レスポンシブ対応） -->
    <div id="controller-section" class="w-full lg:w-[390px] bg-indigo-950 border-t-4 lg:border-t-0 lg:border-l-4 border-pink-500/60 flex flex-col justify-between p-2.5 z-30 shrink-0 select-none overflow-y-auto">

      <!-- スマホ用ミニプレビュー -->
      <div class="relative w-full h-28 bg-black/90 rounded-xl border-2 border-pink-400/50 overflow-hidden mb-1.5 shrink-0 shadow-inner" id="mini-preview-container">
        <div class="absolute top-1 left-2 z-10 text-[9px] font-black text-yellow-300 bg-black/60 px-1.5 py-0.5 rounded">👀 あなたの視点</div>
      </div>

      <!-- 上部コントロール -->
      <div class="space-y-1 shrink-0">
        <div class="flex items-center justify-between bg-indigo-900/90 p-2 rounded-xl border border-white/20 shadow">
          <div class="flex items-center gap-2">
            <div id="ctrl-color-icon" class="w-7 h-7 rounded-lg bg-pink-500 border-2 border-white flex items-center justify-center text-xs font-black">😆</div>
            <div>
              <input id="ctrl-name-input" type="text" maxlength="8" value="PLAYER" onchange="sendProfileUpdate()"
                class="bg-transparent font-black text-xs text-white focus:outline-none border-b border-dashed border-pink-300 w-20" />
              <div id="ctrl-sync-text" class="text-[8px] text-emerald-300 font-bold">🟢 同期OK</div>
            </div>
          </div>
          <div class="text-right bg-black/40 px-2 py-0.5 rounded-lg border border-yellow-400/40">
            <div class="text-[8px] text-yellow-200 font-bold">SCORE</div>
            <div id="ctrl-score-num" class="font-arcade text-lg font-black text-yellow-300">0</div>
          </div>
        </div>

        <div class="flex items-center gap-1 bg-black/40 px-2 py-1 rounded-xl border border-white/15 text-xs">
          <span class="text-indigo-200 font-bold text-[10px] shrink-0">ROOM:</span>
          <input id="manual-room-input" type="text" maxlength="6" placeholder="4桁"
            class="bg-indigo-950 text-yellow-300 font-arcade font-bold px-1.5 py-0.5 rounded border border-indigo-600 w-16 text-center uppercase text-xs" />
          <button onclick="connectToManualRoom()" class="arcade-btn bg-pink-500 text-white font-black px-2 py-0.5 rounded text-[11px] ml-auto">接続</button>
        </div>
      </div>

      <!-- スティック ＆ ボタン -->
      <div class="flex-1 flex items-center justify-around py-1 gap-2 relative min-h-[145px]">
        <div class="flex flex-col items-center">
          <div id="joy-zone" class="w-28 h-28 rounded-full bg-indigo-900/90 border-3 border-pink-400/50 relative flex items-center justify-center shadow-[inset_0_4px_10px_rgba(0,0,0,0.6)] touch-none">
            <div class="absolute inset-2 rounded-full border border-dashed border-white/20 pointer-events-none"></div>
            <div id="joy-knob" class="w-12 h-12 rounded-full bg-gradient-to-b from-yellow-300 to-amber-500 border-2 border-white shadow pointer-events-none flex items-center justify-center font-black text-slate-900 text-[9px]">
              移動
            </div>
          </div>
          <span class="text-[9px] text-indigo-200 mt-1 font-bold">🕹️ ぐりぐり移動</span>
        </div>

        <div class="flex flex-col gap-1 items-center">
          <button id="btn-jump"
            class="arcade-btn w-28 h-9 rounded-lg bg-gradient-to-b from-emerald-400 to-emerald-600 border-2 border-white flex items-center justify-center shadow">
            <span class="text-[11px] font-black text-slate-950">ジャンプ</span>
          </button>
          <div class="flex gap-1">
            <button id="btn-dive"
              class="arcade-btn w-14 h-14 rounded-full bg-gradient-to-b from-cyan-300 to-blue-600 border-2 border-white flex flex-col items-center justify-center shadow">
              <span class="text-[9px] font-black text-white leading-tight">飛び込み</span>
            </button>
            <button id="btn-spin"
              class="arcade-btn w-18 h-18 rounded-full bg-gradient-to-b from-pink-400 to-rose-600 border-2 border-white flex flex-col items-center justify-center shadow">
              <span class="text-[9px] font-black text-yellow-200 leading-tight">回転攻撃</span>
              <span id="spin-cd-text" class="text-[7px] text-white font-bold">READY</span>
            </button>
          </div>
        </div>
      </div>

      <!-- リアクション弾幕 -->
      <div class="space-y-1 bg-indigo-900/70 p-1.5 rounded-xl border border-white/15 shrink-0">
        <div class="text-[9px] font-black text-yellow-300">💬 リアクション弾幕</div>
        <div class="grid grid-cols-4 gap-1">
          <button onclick="sendReaction('🔥 どけーっ！')" class="arcade-btn bg-indigo-800 py-1 rounded text-[9px] font-black">🔥どけ</button>
          <button onclick="sendReaction('👑 王冠よこせ！')" class="arcade-btn bg-indigo-800 py-1 rounded text-[9px] font-black">👑よこせ</button>
          <button onclick="sendReaction('😱 落ちるぅぅ！')" class="arcade-btn bg-indigo-800 py-1 rounded text-[9px] font-black">😱落ちる</button>
          <button onclick="sendReaction('🤣 わちゃわちゃｗ')" class="arcade-btn bg-indigo-800 py-1 rounded text-[9px] font-black">🤣わちゃ</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      initAudio();
      document.getElementById('btn-audio').textContent = soundEnabled ? '🔊 音' : '🔇 黙';
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'boing') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(220, now); osc.frequency.exponentialRampToValueAtTime(520, now + 0.08);
          gain.gain.setValueAtTime(0.18, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
          osc.start(now); osc.stop(now + 0.18);
        } else if (type === 'jump') {
          osc.type = 'triangle'; osc.frequency.setValueAtTime(260, now); osc.frequency.exponentialRampToValueAtTime(680, now + 0.16);
          gain.gain.setValueAtTime(0.18, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
          osc.start(now); osc.stop(now + 0.16);
        } else if (type === 'dive') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.22);
          gain.gain.setValueAtTime(0.18, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
          osc.start(now); osc.stop(now + 0.22);
        } else if (type === 'spin') {
          osc.type = 'square'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(900, now + 0.25);
          gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (type === 'ko') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(587, now + 0.08);
          gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
          osc.start(now); osc.stop(now + 0.45);
        } else if (type === 'crown') {
          osc.type = 'triangle'; osc.frequency.setValueAtTime(523, now); osc.frequency.setValueAtTime(784, now + 0.14);
          gain.gain.setValueAtTime(0.22, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
          osc.start(now); osc.stop(now + 0.4);
        }
      } catch (e) {}
    }

    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    let currentMode = roomParam ? 'controller' : 'host';
    let roomCode = (roomParam || Math.random().toString(36).substring(2, 6)).toUpperCase();
    let myClientId = 'p_' + Math.random().toString(36).substring(2, 9);

    let mqttClient = null;
    let mqttTopicHost = '';
    let mqttTopicState = '';
    let packetsCount = 0;

    const POP_COLORS = ['#ff477e', '#00f5d4', '#fee440', '#9b5de5', '#f15bb5', '#00bbf9', '#ff9f1c', '#38b000'];
    const POP_FACES = ['😆', '😎', '🤩', '😈', '🥳', '🤖', '🐱', '🦊'];

    let scene, camera, renderer, gltfLoader;
    let stageRadius = 36;
    let platformGroup, sweeperBarGroup, crownMesh;
    let customBlenderModelTemplate = null;

    let miniScene, miniCamera, miniRenderer;
    const players = {};
    const candies = [];
    let crownState = { holderId: null, x: 0, z: 0, angle: 0 };
    let sweeperState = { active: false, angle: 0, speed: 0.028 };
    let eventCountdown = 20;

    function initThreeStage() {
      const container = document.getElementById('three-container');
      const w = container.clientWidth || 800;
      const h = container.clientHeight || 600;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a103c);
      scene.fog = new THREE.FogExp2(0x1a103c, 0.006);

      camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 350);
      camera.position.set(0, 42, 52);
      camera.lookAt(0, 0, 2);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x4c1d95, 0.95));
      const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.9);
      dirLight.position.set(30, 50, 30); dirLight.castShadow = true;
      scene.add(dirLight);

      platformGroup = new THREE.Group();
      scene.add(platformGroup);
      buildPopArenaStage();

      crownMesh = createCrownMesh();
      scene.add(crownMesh);

      sweeperBarGroup = createSweeperBar();
      sweeperBarGroup.visible = false;
      scene.add(sweeperBarGroup);

      for (let i = 0; i < 16; i++) spawnCandy();

      if (THREE.GLTFLoader) {
        gltfLoader = new THREE.GLTFLoader();
        tryAutoLoadCharacterGLB();
      }

      initMiniPreview();

      window.addEventListener('resize', () => {
        if (!container.clientWidth || !container.clientHeight) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });
    }

    function initMiniPreview() {
      const previewBox = document.getElementById('mini-preview-container');
      if (!previewBox) return;
      const w = previewBox.clientWidth || 350;
      const h = previewBox.clientHeight || 112;

      miniScene = new THREE.Scene();
      miniScene.background = new THREE.Color(0x0f0c1b);
      miniCamera = new THREE.PerspectiveCamera(50, w / h, 0.1, 200);

      miniRenderer = new THREE.WebGLRenderer({ antialias: true });
      miniRenderer.setSize(w, h);
      miniRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      previewBox.appendChild(miniRenderer.domElement);
      miniScene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 1.0));
    }

    function buildPopArenaStage() {
      while (platformGroup.children.length) platformGroup.remove(platformGroup.children[0]);
      const floor = new THREE.Mesh(new THREE.CylinderGeometry(stageRadius, stageRadius * 0.94, 3, 48), new THREE.MeshStandardMaterial({ color: 0x3b0764, roughness: 0.4 }));
      floor.position.y = -1.5; floor.receiveShadow = true;
      platformGroup.add(floor);

      const ringColors = [0xf43f5e, 0xfacc15, 0x06b6d4, 0xa855f7];
      ringColors.forEach((col, idx) => {
        const rInner = idx * 8, rOuter = rInner + 7.5;
        if (rOuter <= stageRadius) {
          const ring = new THREE.Mesh(new THREE.RingGeometry(rInner, rOuter, 48).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.28, side: THREE.DoubleSide }));
          ring.position.y = 0.03 + idx * 0.01;
          platformGroup.add(ring);
        }
      });
      platformGroup.add(new THREE.Mesh(new THREE.TorusGeometry(stageRadius, 0.45, 16, 64).rotateX(Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xfacc15 })));
    }

    function createCrownMesh() {
      const group = new THREE.Group();
      group.add(new THREE.Mesh(new THREE.CylinderGeometry(1.1, 0.85, 0.9, 8), new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xd97706, metalness: 0.6 })));
      const gem = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 8), new THREE.MeshBasicMaterial({ color: 0xf43f5e }));
      gem.position.y = 0.55; group.add(gem);
      group.position.set(0, 1.2, 0); return group;
    }

    function createSweeperBar() {
      const group = new THREE.Group();
      const post = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.8, 3.2, 16), new THREE.MeshStandardMaterial({ color: 0xfacc15 }));
      post.position.y = 1.6; group.add(post);
      const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, stageRadius * 1.85, 16), new THREE.MeshStandardMaterial({ color: 0xf43f5e, emissive: 0xbe123c }));
      bar.rotateZ(Math.PI / 2); bar.position.y = 1.1; group.add(bar);
      return group;
    }

    function createChibiCharacterMesh(colorHex) {
      const root = new THREE.Group();
      if (customBlenderModelTemplate) {
        const cloned = customBlenderModelTemplate.clone();
        const ring = new THREE.Mesh(new THREE.RingGeometry(1.1, 1.45, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide }));
        ring.position.y = 0.05; root.add(ring); root.add(cloned);
        root.userData = { isCustomGLB: true, bodyGroup: cloned };
        return root;
      }
      const bodyGroup = new THREE.Group(); root.add(bodyGroup);
      const mainMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.35 });
      const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
      const darkMat = new THREE.MeshBasicMaterial({ color: 0x111827 });

      const torso = new THREE.Mesh(new THREE.SphereGeometry(0.95, 18, 16), mainMat);
      torso.scale.set(1, 1.1, 0.9); torso.position.y = 1.1; torso.castShadow = true; bodyGroup.add(torso);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.85, 18, 16), mainMat);
      head.position.y = 2.35; head.castShadow = true; bodyGroup.add(head);
      const face = new THREE.Mesh(new THREE.SphereGeometry(0.62, 16, 12), whiteMat);
      face.scale.set(1.05, 0.75, 0.5); face.position.set(0, 2.38, 0.52); bodyGroup.add(face);

      const eyeGeo = new THREE.SphereGeometry(0.13, 8, 8); eyeGeo.scale(1, 1.4, 0.6);
      const eyeL = new THREE.Mesh(eyeGeo, darkMat); eyeL.position.set(-0.22, 2.42, 0.75);
      const eyeR = new THREE.Mesh(eyeGeo, darkMat); eyeR.position.set(0.22, 2.42, 0.75);
      bodyGroup.add(eyeL, eyeR);

      const armGeo = new THREE.SphereGeometry(0.32, 10, 10); armGeo.scale(0.8, 1.6, 0.8);
      const armL = new THREE.Mesh(armGeo, mainMat); armL.position.set(-1.05, 1.35, 0);
      const armR = new THREE.Mesh(armGeo, mainMat); armR.position.set(1.05, 1.35, 0);
      bodyGroup.add(armL, armR);

      const legGeo = new THREE.SphereGeometry(0.35, 10, 10); legGeo.scale(0.9, 1.3, 1.2);
      const legL = new THREE.Mesh(legGeo, whiteMat); legL.position.set(-0.42, 0.35, 0);
      const legR = new THREE.Mesh(legGeo, whiteMat); legR.position.set(0.42, 0.35, 0);
      bodyGroup.add(legL, legR);

      const ring = new THREE.Mesh(new THREE.RingGeometry(1.1, 1.35, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.75, side: THREE.DoubleSide }));
      ring.position.y = 0.05; root.add(ring);
      root.userData = { isCustomGLB: false, bodyGroup, armL, armR, legL, legR, head };
      return root;
    }

    function tryAutoLoadCharacterGLB() {
      gltfLoader.load('./character.glb', (gltf) => applyLoadedGLBModel(gltf.scene, 'character.glb'), undefined, () => {});
    }

    function handleLocalGLBUpload(event) {
      const file = event.target.files[0];
      if (!file || !gltfLoader) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        gltfLoader.parse(e.target.result, '', (gltf) => applyLoadedGLBModel(gltf.scene, file.name));
      };
      reader.readAsArrayBuffer(file);
    }

    function applyLoadedGLBModel(gltfScene, fileName) {
      const box = new THREE.Box3().setFromObject(gltfScene);
      const size = new THREE.Vector3(); box.getSize(size);
      const scale = 2.8 / (Math.max(size.x, size.y, size.z) || 1);
      gltfScene.scale.set(scale, scale, scale);
      gltfScene.position.y = -new THREE.Box3().setFromObject(gltfScene).min.y;
      customBlenderModelTemplate = gltfScene;
      Object.values(players).forEach(p => {
        scene.remove(p.mesh); p.mesh = createChibiCharacterMesh(p.color); scene.add(p.mesh);
      });
      spawnDanmaku(`🎉 3Dモデル「${fileName}」を適用！`, '#facc15');
      playSound('crown');
    }

    function spawnCandy() {
      const col = [0xff477e, 0x00f5d4, 0xfee440, 0xa855f7][Math.floor(Math.random() * 4)];
      const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.65, 1), new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.35 }));
      const ang = Math.random() * Math.PI * 2, rad = 5 + Math.random() * (stageRadius - 8);
      mesh.position.set(Math.cos(ang) * rad, 0.8, Math.sin(ang) * rad);
      scene.add(mesh); candies.push({ mesh, phase: Math.random() * 6 });
    }

    function ensurePlayer(id, name, isBot = false) {
      if (players[id]) {
        if (name && !players[id].isBot) players[id].name = name;
        return players[id];
      }
      const idx = Object.keys(players).length;
      const color = POP_COLORS[idx % POP_COLORS.length];
      const face = isBot ? '🤖' : POP_FACES[idx % POP_FACES.length];
      const mesh = createChibiCharacterMesh(color);
      const ang = Math.random() * Math.PI * 2, rad = 4 + Math.random() * 10;
      const sx = Math.cos(ang) * rad, sz = Math.sin(ang) * rad;
      mesh.position.set(sx, 8, sz); scene.add(mesh);

      players[id] = {
        id, name: name || `P${idx + 1}`, face, color, isBot, mesh,
        x: sx, y: 8, z: sz, vx: 0, vy: 0, vz: 0, joyX: 0, joyY: 0,
        angle: 0, walkCycle: 0, score: 0, spinCd: 0, diveTimer: 0, spinAnimTimer: 0, botDecisionTimer: 0, lastHitBy: null
      };
      updateRankingUI(); updateBotCountUI();
      return players[id];
    }

    function spawnBot() {
      const botNames = ['ぷにロボ', 'モチまる', 'コロ助', 'ピコ太郎', 'ネジくん', 'タマちゃん', 'メカっち', 'ゴロリ'];
      const botList = Object.values(players).filter(p => p.isBot);
      ensurePlayer('bot_' + Math.random().toString(36).substring(2, 7), botNames[botList.length % botNames.length] + (botList.length + 1), true);
      playSound('jump');
    }

    function removeBot() {
      const botIds = Object.keys(players).filter(id => players[id].isBot);
      if (botIds.length === 0) return;
      const targetId = botIds[botIds.length - 1];
      if (crownState.holderId === targetId) { crownState.holderId = null; crownState.x = 0; crownState.z = 0; }
      scene.remove(players[targetId].mesh); delete players[targetId];
      updateRankingUI(); updateBotCountUI(); playSound('boing');
    }

    function clearBots() {
      Object.keys(players).filter(id => players[id].isBot).forEach(id => {
        if (crownState.holderId === id) { crownState.holderId = null; crownState.x = 0; crownState.z = 0; }
        scene.remove(players[id].mesh); delete players[id];
      });
      updateRankingUI(); updateBotCountUI(); playSound('boing');
    }

    function updateBotCountUI() {
      const count = Object.values(players).filter(p => p.isBot).length;
      const badge = document.getElementById('bot-count-badge');
      if (badge) badge.textContent = `${count}体`;
    }

    function doJump(p) { if (p.y <= 0.15) { p.vy = 0.58; playSound('jump'); } }
    function doDive(p) {
      if (p.diveTimer > 0) return;
      const dirX = Math.abs(p.joyX) + Math.abs(p.joyY) > 0.1 ? p.joyX : Math.sin(p.angle);
      const dirZ = Math.abs(p.joyX) + Math.abs(p.joyY) > 0.1 ? p.joyY : Math.cos(p.angle);
      const len = Math.hypot(dirX, dirZ) || 1;
      p.vx += (dirX / len) * 1.05; p.vz += (dirZ / len) * 1.05;
      if (p.y <= 0.2) p.vy = 0.28;
      p.diveTimer = 22; playSound('dive');
    }

    function doSpinAttack(p) {
      if (p.spinCd > 0) return;
      p.spinCd = 120; p.spinAnimTimer = 25; playSound('spin');
      const ringMesh = new THREE.Mesh(new THREE.RingGeometry(0.8, 1.5, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: p.color, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
      ringMesh.position.set(p.x, p.y + 0.6, p.z); scene.add(ringMesh);
      let f = 0;
      const anim = setInterval(() => {
        f++; ringMesh.scale.setScalar(1 + f * 0.65); ringMesh.material.opacity = 1 - f / 14;
        if (f >= 14) { clearInterval(anim); scene.remove(ringMesh); }
      }, 16);

      const powerMult = crownState.holderId === p.id ? 1.4 : 1.0;
      Object.values(players).forEach(other => {
        if (other.id === p.id) return;
        const dx = other.x - p.x, dz = other.z - p.z, dist = Math.hypot(dx, dz);
        if (dist < 8.5 && dist > 0.01) {
          const force = ((8.5 - dist) / 8.5) * 1.35 * powerMult;
          other.vx += (dx / dist) * force; other.vz += (dz / dist) * force; other.vy = 0.38;
          other.lastHitBy = p.id;
          showFloatingText(other.x, other.y + 2, other.z, '💥 HIT!', '#facc15');
        }
      });
    }

    function triggerArenaEvent() {
      sweeperState.active = !sweeperState.active;
      sweeperBarGroup.visible = sweeperState.active;
      const banner = document.getElementById('big-alert'), statusEl = document.getElementById('stage-status');
      if (sweeperState.active) {
        statusEl.textContent = '⚠️ 回転ハンマー稼働中！ジャンプで回避！';
        banner.textContent = '⚠️ 回転ハンマー出現！ジャンプで飛び越えろ！';
        banner.classList.remove('hidden'); setTimeout(() => banner.classList.add('hidden'), 4000);
        playSound('ko');
      } else {
        statusEl.textContent = '👑 中央の「王冠」を奪い合え！';
        for (let i = 0; i < 6; i++) spawnCandy();
        banner.textContent = '🍬 キャンディ大量出現！';
        banner.classList.remove('hidden'); setTimeout(() => banner.classList.add('hidden'), 3500);
        playSound('crown');
      }
    }

    // 物理演算 ＆ 全状態同期送信
    function updateGamePhysics() {
      const pList = Object.values(players);

      if (sweeperState.active) {
        sweeperState.angle += sweeperState.speed;
        sweeperBarGroup.rotation.y = sweeperState.angle;
      }

      crownState.angle += 0.05;
      if (crownState.holderId && players[crownState.holderId]) {
        const holder = players[crownState.holderId];
        crownMesh.position.set(holder.x, holder.y + 4.3, holder.z);
        crownMesh.rotation.y = crownState.angle;
      } else {
        crownState.holderId = null;
        crownMesh.position.set(crownState.x, 1.3 + Math.sin(crownState.angle * 2) * 0.3, crownState.z);
        crownMesh.rotation.y = crownState.angle;
      }

      pList.forEach(p => {
        if (p.spinCd > 0) p.spinCd--;
        if (p.diveTimer > 0) p.diveTimer--;
        if (p.spinAnimTimer > 0) p.spinAnimTimer--;

        if (p.isBot) {
          p.botDecisionTimer--;
          if (p.botDecisionTimer <= 0) {
            p.botDecisionTimer = 22 + Math.floor(Math.random() * 25);
            const distCenter = Math.hypot(p.x, p.z);
            if (distCenter > stageRadius * 0.75) {
              p.joyX = -p.x / distCenter; p.joyY = -p.z / distCenter;
            } else if (!crownState.holderId) {
              const dx = crownState.x - p.x, dz = crownState.z - p.z, d = Math.hypot(dx, dz) || 1;
              p.joyX = dx / d; p.joyY = dz / d;
            } else {
              const others = pList.filter(o => o.id !== p.id);
              if (others.length > 0) {
                const target = others[Math.floor(Math.random() * others.length)];
                const dx = target.x - p.x, dz = target.z - p.z, d = Math.hypot(dx, dz) || 1;
                p.joyX = dx / d; p.joyY = dz / d;
                if (d < 5 && Math.random() < 0.4) doSpinAttack(p);
              }
            }
          }
          if (sweeperState.active && p.y <= 0.1 && Math.random() < 0.035) doJump(p);
        }

        const moveAccel = crownState.holderId === p.id ? 0.045 : 0.038;
        p.vx += p.joyX * moveAccel; p.vz += p.joyY * moveAccel;
        p.x += p.vx; p.z += p.vz;
        p.vx *= 0.84; p.vz *= 0.84;

        const distFromCenter = Math.hypot(p.x, p.z);
        if (distFromCenter <= stageRadius + 0.8 && p.y >= -0.4) {
          p.y += p.vy;
          if (p.y > 0) p.vy -= 0.03; else { p.y = 0; p.vy = 0; }
        } else {
          p.y += p.vy; p.vy -= 0.045;
        }

        const targetScale = crownState.holderId === p.id ? 1.3 : 1.0;
        p.mesh.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);

        const speed = Math.hypot(p.vx, p.vz);
        if (speed > 0.02) { p.angle = Math.atan2(p.vx, p.vz); p.walkCycle += speed * 2.2; }
        p.mesh.position.set(p.x, p.y, p.z);

        const ud = p.mesh.userData;
        if (p.spinAnimTimer > 0) { p.mesh.rotation.y += 0.65; } else { p.mesh.rotation.y = p.angle; }

        if (ud && !ud.isCustomGLB && ud.bodyGroup) {
          if (p.diveTimer > 0) {
            ud.bodyGroup.rotation.x = Math.PI / 2.2; ud.bodyGroup.position.y = 0.6;
          } else {
            ud.bodyGroup.rotation.x = Math.min(0.35, speed * 0.7);
            ud.bodyGroup.position.y = Math.abs(Math.sin(p.walkCycle)) * 0.22;
            const swing = Math.sin(p.walkCycle) * Math.min(0.9, speed * 3.5);
            ud.armL.rotation.x = swing; ud.armR.rotation.x = -swing;
            ud.legL.rotation.x = -swing; ud.legR.rotation.x = swing;
          }
        }

        if (!crownState.holderId && p.y >= 0 && Math.hypot(p.x - crownState.x, p.z - crownState.z) < 2.2) {
          crownState.holderId = p.id; p.score += 100; playSound('crown');
          showFloatingText(p.x, p.y + 3, p.z, '👑 CROWN GET! +100', '#facc15');
          spawnDanmaku(`👑 ${p.name} が王冠奪取！`, '#facc15');
          updateRankingUI();
        }

        if (sweeperState.active && p.y < 1.5 && distFromCenter < stageRadius * 0.92) {
          const barCos = Math.cos(-sweeperState.angle), barSin = Math.sin(-sweeperState.angle);
          if (Math.abs(p.x * barSin + p.z * barCos) < 1.35) {
            p.vx += -barSin * 1.0; p.vz += -barCos * 1.0; p.vy = 0.42;
            playSound('boing'); showFloatingText(p.x, p.y + 2, p.z, '💥 HAMMER!', '#f43f5e');
          }
        }

        if (p.y < -11) handlePlayerRingOut(p);
      });

      // 押し合い判定
      for (let i = 0; i < pList.length; i++) {
        for (let j = i + 1; j < pList.length; j++) {
          const a = pList[i], b = pList[j];
          if (Math.abs(a.y - b.y) > 2.2) continue;
          const dx = b.x - a.x, dz = b.z - a.z, dist = Math.hypot(dx, dz);
          if (dist < 2.2 && dist > 0.001) {
            const nx = dx / dist, nz = dz / dist, overlap = 2.2 - dist;
            a.x -= nx * overlap * 0.5; a.z -= nz * overlap * 0.5;
            b.x += nx * overlap * 0.5; b.z += nz * overlap * 0.5;
            a.vx -= nx * 0.32; a.vz -= nz * 0.32;
            b.vx += nx * 0.32; b.vz += nz * 0.32;
            a.lastHitBy = b.id; b.lastHitBy = a.id; playSound('boing');
          }
        }
      }

      candies.forEach(c => {
        c.phase += 0.07; c.mesh.rotation.y += 0.05;
        c.mesh.position.y = 0.8 + Math.sin(c.phase) * 0.25;
        pList.forEach(p => {
          if (p.y >= -0.2 && Math.hypot(p.x - c.mesh.position.x, p.z - c.mesh.position.z) < 1.9) {
            p.score += 20; showFloatingText(p.x, p.y + 2, p.z, '+20 🍬', '#00f5d4');
            const ang = Math.random() * Math.PI * 2, rad = 4 + Math.random() * (stageRadius - 7);
            c.mesh.position.set(Math.cos(ang) * rad, 0.8, Math.sin(ang) * rad);
            updateRankingUI();
          }
        });
      });

      if (crownState.holderId && players[crownState.holderId] && Math.random() < 0.08) {
        players[crownState.holderId].score += 2; updateRankingUI();
      }

      const me = players[myClientId];
      if (me) {
        document.getElementById('ctrl-score-num').textContent = me.score;
        const cdEl = document.getElementById('spin-cd-text');
        cdEl.textContent = me.spinCd > 0 ? `${(me.spinCd / 60).toFixed(1)}s` : 'READY';

        if (miniScene && miniCamera && miniRenderer) {
          miniCamera.position.set(me.x, me.y + 12, me.z + 10);
          miniCamera.lookAt(me.x, me.y, me.z);
          miniRenderer.render(scene, miniCamera);
        }
      }
    }

    function handlePlayerRingOut(victim) {
      playSound('ko');
      if (crownState.holderId === victim.id) {
        crownState.holderId = null; crownState.x = 0; crownState.z = 0;
        spawnDanmaku(`👑 ${victim.name} が王冠を落とした！`, '#facc15');
      }
      if (victim.lastHitBy && players[victim.lastHitBy] && victim.lastHitBy !== victim.id) {
        const killer = players[victim.lastHitBy]; killer.score += 150;
        showFloatingText(killer.x, killer.y + 3, killer.z, `🔥 KO! +150`, '#ff477e');
        spawnDanmaku(`💥 ${killer.name} が ${victim.name} を場外KO！`, killer.color);
      }
      victim.x = (Math.random() - 0.5) * 8; victim.z = (Math.random() - 0.5) * 8;
      victim.y = 12; victim.vx = 0; victim.vy = 0; victim.vz = 0; victim.lastHitBy = false;
      updateRankingUI();
    }

    function showFloatingText(x, y, z, text, color = '#fff') {
      const container = document.getElementById('three-container'), layer = document.getElementById('floating-layer');
      if (!container || !layer || !camera) return;
      const vec = new THREE.Vector3(x, y, z).project(camera);
      const el = document.createElement('div');
      el.className = 'floating-score text-sm';
      el.style.left = `${(vec.x * 0.5 + 0.5) * container.clientWidth}px`;
      el.style.top = `${(-(vec.y * 0.5) + 0.5) * container.clientHeight}px`;
      el.style.color = color; el.textContent = text;
      layer.appendChild(el); setTimeout(() => el.remove(), 1100);
    }

    function spawnDanmaku(text, color = '#ffffff') {
      const layer = document.getElementById('danmaku-layer');
      if (!layer) return;
      const item = document.createElement('div');
      item.className = 'danmaku-item text-base md:text-xl';
      item.style.top = `${15 + Math.random() * 55}%`; item.style.color = color; item.textContent = text;
      layer.appendChild(item); setTimeout(() => item.remove(), 6500);

    function updateRankingUI() {
      const list = Object.values(players).sort((a, b) => b.score - a.score);
      document.getElementById('player-count').textContent = `${list.length}人`;
      document.getElementById('leaderboard').innerHTML = list.map((p, i) => `
        <div class="flex items-center justify-between px-1.5 py-0.5 rounded ${i === 0 ? 'bg-yellow-400/25 border border-yellow-300/50' : 'bg-black/40'}">
          <div class="flex items-center gap-1 truncate">
            <span class="font-arcade font-black w-3 text-yellow-300">${i + 1}</span>
            <span>${crownState.holderId === p.id ? '👑' : p.face}</span>
            <span class="font-black truncate text-white">${p.name}</span>
          </div>
          <span class="font-arcade font-black text-yellow-300">${p.score}</span>
        </div>
      `).join('');
    }

    function resetMatch() {
      crownState.holderId = null; crownState.x = 0; crownState.z = 0;
      Object.values(players).forEach(p => {
        p.score = 0; p.x = (Math.random() - 0.5) * 10; p.z = (Math.random() - 0.5) * 10; p.y = 8; p.vx = 0; p.vy = 0; p.vz = 0;
      });
      updateRankingUI(); spawnDanmaku('🔄 スコア＆王冠リセット！', '#00f5d4');
    }

    // MQTT通信（全プレイヤーの位置とCPU情報を完全同期）
    function initNetworkSync() {
      document.getElementById('room-code-text').textContent = roomCode;
      document.getElementById('manual-room-input').value = roomCode;

      const joinUrl = `${window.location.origin}${window.location.pathname}?room=${roomCode}`;
      const qrBox = document.getElementById('qrcode-box'); qrBox.innerHTML = '';
      new QRCode(qrBox, { text: joinUrl, width: 92, height: 92 });

      mqttTopicHost = `ccc-wacha-2026/${roomCode}/host`;
      mqttTopicState = `ccc-wacha-2026/${roomCode}/state`;

      mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
      mqttClient.on('connect', () => {
        document.getElementById('conn-badge').textContent = `ONLINE`;
        mqttClient.subscribe(mqttTopicHost);
        mqttClient.subscribe(mqttTopicState);
        if (roomParam) sendControllerInput({ type: 'join' });
      });

      mqttClient.on('message', (topic, payload) => {
        try {
          const data = JSON.parse(payload.toString());
          if (topic === mqttTopicHost) {
            handleHostPacket(data);
          } else if (topic === mqttTopicState) {
            // ホストから送られてきた全プレイヤー＆CPUの位置状態をスマホ側へ完全反映！
            if (data.players) {
              Object.keys(data.players).forEach(id => {
                if (id === myClientId) return; // 自分自身の位置は上書きしない
                const pData = data.players[id];
                const p = ensurePlayer(id, pData.name, pData.isBot);
                p.x = pData.x; p.y = pData.y; p.z = pData.z;
                p.score = pData.score;
              });
            }
            if (data.scores && data.scores[myClientId] !== undefined) {
              document.getElementById('ctrl-score-num').textContent = data.scores[myClientId];
            }
          }
        } catch (e) {}
      });
    }

    function connectToManualRoom() {
      const val = document.getElementById('manual-room-input').value.trim().toUpperCase();
      if (!val) return;
      if (mqttClient) { mqttClient.unsubscribe(mqttTopicHost); mqttClient.unsubscribe(mqttTopicState); }
      roomCode = val;
      document.getElementById('room-code-text').textContent = roomCode;
      mqttTopicHost = `ccc-wacha-2026/${roomCode}/host`;
      mqttTopicState = `ccc-wacha-2026/${roomCode}/state`;
      if (mqttClient && mqttClient.connected) {
        mqttClient.subscribe(mqttTopicHost); mqttClient.subscribe(mqttTopicState);
        sendControllerInput({ type: 'join' });
      }
    }

    function sendControllerInput(extra = {}) {
      const name = document.getElementById('ctrl-name-input').value || 'PLAYER';
      const packet = { id: myClientId, name, jx: Number(joyVec.x.toFixed(2)), jy: Number(joyVec.y.toFixed(2)), ...extra };
      handleHostPacket(packet);
      if (mqttClient && mqttClient.connected) mqttClient.publish(mqttTopicHost, JSON.stringify(packet));
    }

    function handleHostPacket(data) {
      if (!data || !data.id) return;
      packetsCount++;
      const p = ensurePlayer(data.id, data.name, false);
      if (typeof data.jx === 'number') p.joyX = data.jx;
      if (typeof data.jy === 'number') p.joyY = data.jy;
      if (data.action === 'jump') doJump(p);
      if (data.action === 'dive') doDive(p);
      if (data.action === 'spin') doSpinAttack(p);
      if (data.reaction) {
        spawnDanmaku(`${p.face} ${p.name}: ${data.reaction}`, p.color);
        showFloatingText(p.x, p.y + 3.2, p.z, data.reaction, '#ffffff');
      }
    }

    function sendProfileUpdate() { sendControllerInput({ type: 'profile' }); }
    function sendReaction(msg) { sendControllerInput({ reaction: msg }); }

    let joyVec = { x: 0, y: 0 };
    function initControllerPad() {
      const zone = document.getElementById('joy-zone'), knob = document.getElementById('joy-knob');
      let dragging = false;

      function updateKnob(clientX, clientY) {
        const rect = zone.getBoundingClientRect();
        const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
        const maxR = rect.width / 2 - 18;
        let dx = clientX - cx, dy = clientY - cy, d = Math.hypot(dx, dy);
        if (d > maxR) { dx = (dx / d) * maxR; dy = (dy / d) * maxR; }
        knob.style.transform = `translate(${dx}px, ${dy}px)`;
        joyVec.x = dx / maxR; joyVec.y = dy / maxR;
      }

      function resetKnob() {
        dragging = false; knob.style.transform = 'translate(0px, 0px)';
        joyVec.x = 0; joyVec.y = 0; sendControllerInput();
      }

      zone.addEventListener('pointerdown', e => { dragging = true; zone.setPointerCapture(e.pointerId); updateKnob(e.clientX, e.clientY); sendControllerInput(); });
      zone.addEventListener('pointermove', e => { if (dragging) updateKnob(e.clientX, e.clientY); });
      zone.addEventListener('pointerup', resetKnob); zone.addEventListener('pointercancel', resetKnob);

      document.getElementById('btn-jump').addEventListener('pointerdown', e => { e.preventDefault(); sendControllerInput({ action: 'jump' }); });
      document.getElementById('btn-dive').addEventListener('pointerdown', e => { e.preventDefault(); sendControllerInput({ action: 'dive' }); });
      document.getElementById('btn-spin').addEventListener('pointerdown', e => { e.preventDefault(); sendControllerInput({ action: 'spin' }); });

      setInterval(() => { if (Math.abs(joyVec.x) > 0.01 || Math.abs(joyVec.y) > 0.01) sendControllerInput(); }, 80);
    }

    function switchViewMode(mode) {
      currentMode = mode;
      const hostSec = document.getElementById('host-section'), ctrlSec = document.getElementById('controller-section');
      document.getElementById('btn-mode-host').className = 'arcade-btn text-[11px] px-2 py-1 rounded-lg bg-indigo-800 text-indigo-100 font-bold';
      document.getElementById('btn-mode-split').className = 'arcade-btn text-[11px] px-2 py-1 rounded-lg bg-indigo-800 text-indigo-100 font-bold';
      document.getElementById('btn-mode-ctrl').className = 'arcade-btn text-[11px] px-2 py-1 rounded-lg bg-indigo-800 text-indigo-100 font-bold';

      if (mode === 'host') {
        hostSec.classList.remove('hidden'); ctrlSec.classList.add('hidden');
        document.getElementById('btn-mode-host').className = 'arcade-btn text-[11px] px-2 py-1 rounded-lg bg-pink-500 text-white font-black';
      } else if (mode === 'controller') {
        hostSec.classList.add('hidden'); ctrlSec.classList.remove('hidden');
        ctrlSec.classList.remove('lg:w-[390px]'); ctrlSec.classList.add('w-full', 'flex-1');
        document.getElementById('btn-mode-ctrl').className = 'arcade-btn text-[11px] px-2 py-1 rounded-lg bg-pink-500 text-white font-black';
      } else {
        hostSec.classList.remove('hidden'); ctrlSec.classList.remove('hidden', 'w-full', 'flex-1');
        ctrlSec.classList.add('lg:w-[390px]');
        document.getElementById('btn-mode-split').className = 'arcade-btn text-[11px] px-2 py-1 rounded-lg bg-pink-500 text-white font-black';
      }
      setTimeout(() => window.dispatchEvent(new Event('resize')), 60);
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('ctrl-name-input').value = `P_${Math.floor(10 + Math.random() * 89)}`;
      initThreeStage();
      initControllerPad();
      initNetworkSync();

      ensurePlayer(myClientId, document.getElementById('ctrl-name-input').value, false);
      spawnBot(); spawnBot(); spawnBot(); spawnBot();

      if (roomParam) switchViewMode('controller'); else switchViewMode('host');

      setInterval(() => {
        eventCountdown--;
        if (eventCountdown <= 0) { eventCountdown = 20; triggerArenaEvent(); }
        const timerEl = document.getElementById('event-timer');
        if (timerEl) timerEl.textContent = `00:${String(eventCountdown).padStart(2, '0')}`;

        // ホスト側から全プレイヤーとCPUの位置・スコア状態を定期ブロードキャスト送信
        if (mqttClient && mqttClient.connected && currentMode !== 'controller') {
          const playersState = {};
          const scoresState = {};
          Object.values(players).forEach(p => {
            playersState[p.id] = { name: p.name, isBot: p.isBot, x: Number(p.x.toFixed(2)), y: Number(p.y.toFixed(2)), z: Number(p.z.toFixed(2)), score: p.score };
            scoresState[p.id] = p.score;
          });
          mqttClient.publish(mqttTopicState, JSON.stringify({ players: playersState, scores: scoresState }));
        }
      }, 1000);

      function animate() {
        requestAnimationFrame(animate);
        updateGamePhysics();
        if (renderer && scene && camera) renderer.render(scene, camera);
      }
      animate();
    });
  </script>
</body>
